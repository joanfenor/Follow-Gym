<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis entrenos">
<meta name="theme-color" content="#0f1216">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icono-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icono-180.png">
<title>Mis entrenos</title>
<style>
:root{--bg:#0f1216;--card:#191e25;--card2:#222933;--tx:#e8edf2;--mu:#8a96a3;--ac:#ff8a3d;--ac2:#5aa9ff;--ok:#3ecf8e;--bd:#2a323d;
  --hdr:rgba(15,18,22,.94);--nav:#141920;--sel:#2b2218;--okbg:linear-gradient(135deg,#123526,#16251f);--cdon:#26303b;--toastbg:#2b333e;--toasttx:#e8edf2;
  --phbase:#1b2027;--covera:#3a2312;--dangerbg:#3a1d1d;--danger:#ff8b8b;--stale:#ffd43b;--staletx:#ffe8a3;--shadow:rgba(0,0,0,.55)}
html[data-theme=light]{--bg:#f3f4f6;--card:#ffffff;--card2:#eceff3;--tx:#1a1e24;--mu:#5f6b78;--ac:#f76b15;--ac2:#1c7ed6;--ok:#1f9d63;--bd:#d9dee5;
  --hdr:rgba(243,244,246,.94);--nav:#ffffff;--sel:#fff0e5;--okbg:#e3f7ec;--cdon:#dde5ee;--toastbg:#1a1e24;--toasttx:#ffffff;
  --phbase:#e9edf2;--covera:#ffd9bf;--dangerbg:#ffe3e3;--danger:#c92a2a;--stale:#a07800;--staletx:#5c4400;--shadow:rgba(0,0,0,.18);color-scheme:light}
html[data-theme=light] .gtag,html[data-theme=light] .gname,html[data-theme=light] .pic .ph{color:color-mix(in srgb,var(--gc) 62%,#000)}
html[data-theme=light] .btn{color:#fff}
html[data-theme=light] .btn.sec{color:var(--tx)}
html[data-theme=light] .btn.ghost{color:var(--mu)}
html[data-theme=light] .att.yes .vbtn,html[data-theme=light] .toca{color:#fff}
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:baseline;gap:10px}
header h1{font-size:20px;margin:0;white-space:nowrap;flex:none}
#hdrSub{min-width:0;color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--nav);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 0 10px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--ac)}
.view[hidden]{display:none}
h2{font-size:17px;margin:6px 0 10px}
h3{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 8px}
.muted{color:var(--mu);font-size:13px}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
input,select{font:inherit;font-size:16px;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
input::placeholder{color:var(--mu);opacity:.6}
.btn{display:block;width:100%;margin-top:10px;background:var(--ac);color:#111;border:0;border-radius:10px;padding:12px;font-weight:700;font-size:15px}
.btn.sec{background:var(--card2);color:var(--tx)}
.btn.ghost{background:none;border:1px dashed var(--bd);color:var(--mu)}
.btn.danger{background:var(--dangerbg);color:var(--danger)}
.btn.sm{width:auto;margin:0;padding:9px 14px;flex:none}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.ib{background:var(--card2);border:0;color:var(--mu);width:36px;height:36px;border-radius:9px;font-size:15px;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:8px 12px;font-size:14px;white-space:nowrap;text-align:left}
.chip.on{background:var(--sel);border-color:var(--ac)}
.chip .dots{display:flex;gap:3px;margin-top:5px}
.chip .dots i{width:16px;height:4px;border-radius:2px}
.toca{margin-left:6px;font-size:10px;background:var(--ok);color:#06210f;border-radius:6px;padding:1px 6px;font-weight:800;vertical-align:middle}
.gtag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--gc) 22%,transparent);color:var(--gc);border:1px solid color-mix(in srgb,var(--gc) 45%,transparent)}
.gtags{display:flex;flex-wrap:wrap;gap:6px}

/* asistencia (Hoy) */
.att{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px}
.att.yes{background:var(--okbg);border-color:rgba(62,207,142,.55)}
.att .when{flex:1;min-width:0}
.att .big{font-size:18px;font-weight:700}
.att input{margin-top:6px;padding:6px 8px;font-size:14px;width:auto;background:transparent}
.vbtn{flex:none;width:112px;height:72px;border-radius:14px;border:2px dashed var(--bd);background:transparent;color:var(--mu);font-size:13px;font-weight:600;line-height:1.2}
.att.yes .vbtn{border:0;background:var(--ok);color:#06210f}
.vbtn b{display:block;font-size:24px;line-height:1}
.dayhead{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:2px 0 10px}
.dayhead .t{font-size:18px;font-weight:700;margin-bottom:8px}
.prog{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .3s}

/* tarjetas de ejercicio */
.ex{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--gc);border-radius:14px;margin:8px 0;overflow:hidden}
.ex.done{border-color:rgba(62,207,142,.6);border-left-color:var(--ok)}
.exh{display:flex;align-items:center;gap:12px;padding:8px;width:100%;background:none;border:0;color:inherit;text-align:left;cursor:pointer}
.skb{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card2);color:var(--danger);font-size:15px;font-weight:700}
.ex.skip{opacity:.55;border-left-color:#5d6773}
.ex.skip .en{text-decoration:line-through}
.ex.skip .exs{color:var(--danger)}
.ex.skip .skb{color:var(--tx)}
.prog{display:flex}
.prog i.sk{background:#5d6773;border-radius:0 4px 4px 0}
.exm{flex:1;min-width:0}
.en{font-weight:650;font-size:15px}
.exs{font-size:13px;color:var(--mu);margin-top:2px}
.ex.done .exs{color:var(--ok);font-weight:600}
.chev{color:var(--mu);font-size:18px;transition:transform .2s}
.ex.open .chev{transform:rotate(90deg)}
.exb{padding:0 12px 12px}
.pic{position:relative;overflow:hidden;background:var(--card2);border-radius:10px;flex:none}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic.big{width:100%;aspect-ratio:3/2;margin-bottom:10px}
.pic.big .f2{animation:fade 3s infinite}
.pic.thumb{width:60px;height:60px}
.pic.thumb .f2{display:none}
.pic.noimg img{display:none}
.pic .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--gc);background:color-mix(in srgb,var(--gc) 16%,var(--phbase))}
.pic.big .ph{font-size:44px}
@keyframes fade{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
.prev{font-size:13px;color:var(--mu);margin:2px 0 10px}
.prev b{color:var(--tx)}
.inp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.inp label{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
.exact{display:flex;gap:8px;margin-top:10px}
.exact .btn{margin:0}

/* evolución */
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px;border-radius:9px;font-weight:600;font-size:14px}
.seg button.on{background:var(--card2);color:var(--tx)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.st .k1{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.st .v{font-size:22px;font-weight:800;margin-top:2px}
.st .s{font-size:12px;color:var(--mu)}
.up{color:var(--ok)}.down{color:var(--danger)}
.cal{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh b{font-size:16px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{font-size:11px;color:var(--mu);text-align:center;padding-bottom:2px}
.cd{aspect-ratio:1/1.12;border:1px solid transparent;border-radius:9px;background:var(--card2);color:var(--mu);padding:3px 3px 4px;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;font-size:12px;min-width:0}
.cd span{text-align:left;padding-left:2px}
.cd.on{background:var(--cdon);color:var(--tx);font-weight:700}
.cd.today{border-color:var(--ac)}
.cd.sel{outline:2px solid var(--tx);outline-offset:-1px}
.cd.fut{opacity:.35}
.cd.blank{background:none}
.cd .bars{display:flex;flex-direction:column;gap:2px}
.cd .bars i{display:block;height:4px;border-radius:2px}
.cd .bars em{font-style:normal;color:var(--ok);font-size:13px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mu);margin:10px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.detail{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-top:12px}
.detail .t{font-weight:700;margin-bottom:8px}
.dl{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}
.dl .pic.thumb{width:44px;height:44px}
.dl .x{flex:1;min-width:0}
.hb{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.hb .l{width:88px;flex:none}
.hb .tr{flex:1;height:14px;background:var(--card2);border-radius:7px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:7px}
.hb .n{width:24px;text-align:right;font-weight:700}
.chart{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.grid{stroke:var(--bd);stroke-width:1}
.ax{fill:var(--mu);font-size:10px}
.lmax{fill:none;stroke:var(--ac);stroke-width:2.5}
.lmin{fill:none;stroke:var(--ac2);stroke-width:2;stroke-dasharray:4 3}
.dmax{fill:var(--ac)}.dmin{fill:var(--ac2)}
.k{display:inline-block;width:14px;height:3px;border-radius:2px}.kmax{background:var(--ac)}.kmin{background:var(--ac2)}
.hi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--bd);font-size:14px}

/* catálogo / selector */
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:6px;margin:6px 0;font:inherit}
.li .x{flex:1;min-width:0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#ov[hidden]{display:none}
#ovBody{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}

/* planes */
.plan{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:8px 0;color:var(--tx);overflow:hidden}
.pbtn{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:12px 12px 6px}
.pexp{background:none;border:0;color:var(--ac);font-weight:600;font-size:13px;padding:4px 12px 12px}
.pday{padding:10px 12px;border-top:1px solid var(--bd)}
.pdn{font-weight:700;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pex{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px;cursor:pointer}
.pexi{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.ib.sm{width:30px;height:30px;font-size:13px}
.ib:disabled{opacity:.25}
.dht{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.dht .t{margin-bottom:0}
.sortb{background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600;flex:none}
.sortb.on{background:var(--ok);color:#06210f;border-color:var(--ok)}
.ex.srt .exh{padding:6px 8px}
.ex.srt{transition:transform .15s ease;position:relative;background:var(--card)}
.ex.srt.dragging{transition:none;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.55);border-color:var(--ac)}
.drag{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--mu);background:var(--card2);border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.stale{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--stale);background:rgba(255,212,59,.12);border:1px solid rgba(255,212,59,.4);border-radius:6px;padding:0 6px;white-space:nowrap}
.stalebox{background:rgba(255,212,59,.1);border:1px solid rgba(255,212,59,.4);color:var(--staletx);border-radius:10px;padding:9px 10px;font-size:13px;margin:0 0 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.stalebox .sortb{margin-left:auto}
.prow{display:flex;justify-content:space-between}
.pdel{color:var(--danger)}
.pacts{display:flex}
.curplan{background:var(--sel);border:1px solid var(--ac);border-radius:14px;padding:12px}
.curplan .pn{font-weight:700;display:flex;align-items:center;gap:8px;font-size:16px}
.curplan .pd{font-size:13px;color:var(--mu);margin-top:2px}
.pex .pic.thumb{width:44px;height:44px}
.li[data-info]{cursor:pointer}
.btn:disabled{opacity:.35}
.plan.on{border-color:var(--ac);background:var(--sel)}
.plan .pn{font-weight:700;display:flex;align-items:center;gap:8px}
.plan .pd{font-size:13px;color:var(--mu);margin:2px 0 8px}
.plan .pdays{display:flex;flex-wrap:wrap;gap:5px}
.plan .pdays span{font-size:11px;background:var(--card2);border-radius:6px;padding:2px 7px;color:var(--mu)}
.pill{font-size:10px;font-weight:800;background:var(--ac);color:#111;border-radius:6px;padding:1px 6px}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--mu);flex:none}
.plan.on .radio{border-color:var(--ac);background:radial-gradient(var(--ac) 45%,transparent 50%)}
/* portada */
#cover{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 70% at 50% 0%,var(--covera) 0%,var(--bg) 60%);transition:opacity .35s,visibility .35s}
#cover.hide{opacity:0;visibility:hidden}
.cv{width:100%;max-width:420px;text-align:center;margin:auto 0}
.cvicon{width:96px;height:96px;border-radius:50%;border:3px solid var(--ac);object-fit:cover;box-shadow:0 12px 40px rgba(255,138,61,.25);animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.cv h1{font-size:32px;margin:18px 0 4px;letter-spacing:-.02em}
.cvsub{color:var(--mu);font-size:15px}
.cvcard{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:22px 0 6px;text-align:left}
.cvcard .k1{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.cvcard .t{font-size:19px;font-weight:700;margin:2px 0 8px}
.cvst{display:flex;gap:8px;margin-top:12px}
.cvdone{background:var(--okbg);border:1px solid rgba(62,207,142,.55);color:var(--ok);font-weight:700;border-radius:12px;padding:8px 10px;margin-bottom:10px}
.cvdays{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.cvday{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600;text-align:left}
.cvday.on{border-color:var(--ac);background:var(--sel);box-shadow:0 0 0 1px var(--ac)}
.cvday .dots{display:flex;gap:3px;flex:none}
.cvday .dots i{width:14px;height:4px;border-radius:2px}
.cv h1{margin-top:10px}
.cv h1{font-size:28px}
.cvcard{margin:14px 0 4px;padding:12px}
.cvday{padding:8px 12px}
.cvst{margin-top:10px}
.cvst div{padding:6px 10px}
.cvst b{font-size:18px}
.cvver{margin-top:12px}
#cover{padding-top:calc(16px + env(safe-area-inset-top))}
.cvst div{flex:1;background:var(--card2);border-radius:12px;padding:8px 10px}
.cvst b{display:block;font-size:20px}
.cvst span{font-size:11px;color:var(--mu)}
#cvGo{font-size:18px;padding:16px;margin-top:16px;border-radius:14px}
.cvnav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.cvnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:12px;font-weight:700;min-width:0}
.cvnav button span{font-size:22px;line-height:1}
.cvnav button.main{background:var(--ac);border-color:var(--ac);color:#111}
html[data-theme=light] .cvnav button.main{color:#fff}
.cvrun .t{font-size:19px;font-weight:700;margin:2px 0 6px}
.cvrun .prog{margin-top:10px}
.cvver{margin-top:18px;font-size:12px;color:var(--mu)}
.cvver b{color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--toastbg);color:var(--toasttx);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

/* v7: grupos con cronómetro, extras, arrastre, selectores, confirmaciones */
.gsec{margin:14px 0 4px;transition:transform .15s ease;position:relative}
.gsec.dragging{transition:none;z-index:10;filter:drop-shadow(0 10px 24px var(--shadow))}
.gh{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 10px;border-radius:12px;background:color-mix(in srgb,var(--gc) 14%,var(--card));border:1px solid color-mix(in srgb,var(--gc) 35%,var(--bd));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gname{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gc)}
.gcnt{font-size:12px;color:var(--mu)}
.gsp{flex:1}
.gtime{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--mu);margin-right:2px}
.gtime.run{color:var(--ok)}
.gtime.fin{color:var(--tx);font-size:13px}
button.gtime.edt{background:none;border:1px dashed var(--bd);border-radius:8px;padding:5px 7px;font-family:inherit;cursor:pointer}

function normalize(s){
  if (!s.skips) s.skips = {}; if (!Array.isArray(s.acts)) s.acts = clone(DEF_ACTS); if (!Array.isArray(s.actLogs)) s.actLogs = [];
  if (!s.timers) s.timers = {}; if (!s.dayExtra) s.dayExtra = {}; if (!s.theme) s.theme = 'dark'; return s;
}
function planFromTpl(t){ return { id:t.id, name:t.name, desc:t.desc, days: t.days.map(([name, ex], i) => ({ id:String.fromCharCode(65+i), name, ex:[...ex] })) }; }
function defaultState(){ return { version:2, seed:4, activePlan:'mi', skips:{}, plans: TPL.map(planFromTpl), custom:[], logs:[], visits:{} }; }
function valid(s){ return s && typeof s === 'object' && s.version === 2 && Array.isArray(s.logs) && Array.isArray(s.plans) && s.plans.length && typeof s.visits === 'object' && Array.isArray(s.custom); }
function migrateV1(o){
  const s = defaultState();
  const mi = s.plans.find(p => p.id === 'mi');
  const addCustom = (n, g) => { if (!GRP[n] && !s.custom.some(c => c.n === n)) s.custom.push({ n, g: g || 'Otros' }); };
  if (Array.isArray(o.routine) && o.routine.length)
    mi.days = o.routine.map(d => ({ id:d.id, name:d.name, ex:(d.ex||[]).map(e => { addCustom(e.n, e.g); return e.n; }) }));
  if (o.catalog) Object.entries(o.catalog).forEach(([g, list]) => (list||[]).forEach(n => addCustom(n, g)));
  s.logs = (o.logs||[]).map(l => { addCustom(l.n, l.g); return { ...l, plan:'mi' }; });
  return s;
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (valid(s)) return s; } catch(e){}
  try { const o = JSON.parse(localStorage.getItem(KEY_V1)); if (o && Array.isArray(o.logs)) return migrateV1(o); } catch(e){}
  return defaultState();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast('⚠️ No se ha podido guardar'); } }

const groupOf = n => GRP[n] || (state.custom.find(c => c.n === n) || {}).g || 'Otros';
function catalog(){ const c = {}; GROUPS.forEach(g => c[g] = []); EX.forEach(([n,g]) => c[g].push(n)); state.custom.forEach(x => (c[x.g] = c[x.g] || []).push(x.n)); return c; }
/* añade los encogimientos (trapecio) a los planes ya guardados */
if (!(state.seed >= 2)) {
  state.plans.forEach(p => { const t = TPL.find(x => x.id === p.id); if (!t) return;
    t.days.forEach(([name, ex]) => {
      if (!ex.includes('Encogimientos con barra')) return;
      const d = p.days.find(x => x.name === name); if (!d || d.ex.includes('Encogimientos con barra')) return;
      let k = -1; d.ex.forEach((n,i) => { if (groupOf(n) === 'Hombros') k = i; });
      d.ex.splice(k >= 0 ? k + 1 : d.ex.length, 0, 'Encogimientos con barra');
    }); });
  state.seed = 2; save();
}
/* abdominales: solo Pack Abdominales y Crunch en máquina */
if (!(state.seed >= 3)) {
  const MAP = { 'Crunch en polea':'Pack Abdominales', 'Plancha':'Pack Abdominales', 'Rueda abdominal':'Pack Abdominales', 'Pallof press':'Pack Abdominales', 'Elevación de piernas colgado':'Crunch en máquina' };
  state.plans.forEach(p => p.days.forEach(d => { d.ex = [...new Set(d.ex.map(n => MAP[n] || n))]; }));
  state.seed = 3; save();
}
if (!state.skips) state.skips = {};
/* v5: «Aperturas en polea» pasa a «… alta (al centro)» y se añaden polea baja y press katana a tu día de pecho */
if (!(state.seed >= 4)) {
  const OLD = 'Aperturas en polea', NEW = 'Aperturas en polea alta (al centro)';
  state.plans.forEach(p => p.days.forEach(d => { d.ex = [...new Set(d.ex.map(n => n === OLD ? NEW : n))]; }));
  state.logs.forEach(l => { if (l.n === OLD) l.n = NEW; });
  Object.values(state.skips).forEach(a => a.forEach((n, i) => { if (n === OLD) a[i] = NEW; }));
  const mi = state.plans.find(p => p.id === 'mi'), dA = mi && (mi.days.find(d => d.name === 'Pecho · Tríceps') || mi.days.find(d => d.id === 'A'));
  if (dA) {
    const ins = (name, after) => { if (dA.ex.includes(name)) return; const k = dA.ex.indexOf(after); dA.ex.splice(k >= 0 ? k + 1 : dA.ex.length, 0, name); };
    ins('Aperturas en polea baja (al centro)', NEW);
    const lastTri = [...dA.ex].reverse().find(n => groupOf(n) === 'Tríceps');
    ins('Press katana (polea sobre la cabeza)', dA.ex.includes('Extensión en polea (cuerda)') ? 'Extensión en polea (cuerda)' : lastTri);
  }
  state.seed = 4; save();
}
const activePlan = () => state.plans.find(p => p.id === state.activePlan) || state.plans[0];
const dayGroups = day => { const s = new Set(day.ex.map(groupOf)); return [...GROUPS, 'Otros'].filter(g => s.has(g)); };
const isSkip = (n, date) => (state.skips[date] || []).includes(n);
function unskip(n, date){ if (state.skips[date]) { state.skips[date] = state.skips[date].filter(x => x !== n); if (!state.skips[date].length) delete state.skips[date]; } }
const logOn = (n, date) => state.logs.find(l => l.n === n && l.date === date);
function lastBefore(n, date){ let b = null; for (const l of state.logs) if (l.n === n && l.date < date && newer(l,b)) b = l; return b; }
const logsFor = n => state.logs.filter(l => l.n === n && l.max != null).sort((a,b) => a.date.localeCompare(b.date) || a.ts - b.ts);
const hasLogs = n => state.logs.some(l => l.n === n);
function suggestedDay(plan){
  if (!plan.days.length) return null;
  let last = null; for (const l of state.logs) if ((l.plan === plan.id || (plan.base && l.plan === plan.base)) && newer(l,last)) last = l;
  if (!last) return plan.days[0].id;
  const i = plan.days.findIndex(d => d.id === last.day);
  if (i < 0) return plan.days[0].id;
  if (last.date === todayISO()) return last.day;
  return plan.days[(i + 1) % plan.days.length].id;
}
/* índice por fecha: grupos y ejercicios de cada día */
function dayIndex(){
  const m = {}, get = d => m[d] = m[d] || { groups:new Set(), logs:[], acts:[] };
  for (const l of state.logs) { const d = get(l.date); d.groups.add(l.g || groupOf(l.n)); d.logs.push(l); }
  for (const a of state.actLogs) get(a.date).acts.push(a);                    // actividades extra: cuentan como día de gym
  for (const d of Object.keys(state.visits)) if (state.visits[d]) get(d);
  for (const [d, T] of Object.entries(state.timers)) if (Object.values(T).some(t => tMs(t) > 0)) get(d);
  Object.values(m).forEach(v => { v.groups = [...GROUPS, 'Otros'].filter(g => v.groups.has(g)); });
  return m;
}

/* ---------- ejercicio que llevas mucho tiempo haciendo ---------- */
const dBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
function staleMonths(n){
  const ds = [...new Set(state.logs.filter(l => l.n === n && l.max != null).map(l => l.date))].sort().reverse();
  if (!ds.length || dBetween(ds[0], todayISO()) > 45) return 0;          // ya no lo haces
  let start = ds[0];
  for (let i = 1; i < ds.length; i++) { if (dBetween(ds[i], start) > 45) break; start = ds[i]; } // racha sin parones de más de 45 días
  const d = dBetween(start, todayISO());
  return d >= 90 ? Math.floor(d / 30.4) : 0;
}
const staleBadge = n => { const m = staleMonths(n); return m ? ` <span class="stale">⚠️ ${m} meses</span>` : ''; };
const staleNote = (n, withBtn) => { const m = staleMonths(n); return m ? `<div class="stalebox"><span>⚠️ Llevas <b>${m} meses</b> seguidos con este ejercicio. Cambiarlo por otro de ${esc(groupOf(n))} ayuda a seguir progresando.</span>${withBtn ? ' <button class="sortb" data-act="swap">⇄ Cambiar</button>' : ''}</div>` : ''; };

const actOf = id => state.acts.find(a => a.id === id) || DEF_ACTS.find(a => a.id === id) || { id, n:'Actividad', ico:'⭐', c:'#868e96' };
function tGet(date, g){ return (state.timers[date] || {})[g]; }
function tRun(t){ return !!t && t.segs.length > 0 && t.segs[t.segs.length-1][1] == null; }
function tMs(t){ return !t ? 0 : t.segs.reduce((a, [s, e]) => a + ((e || Date.now()) - s), 0); }
function tStart(date, g){
  const T = state.timers[date] = state.timers[date] || {}, now = Date.now();
  Object.entries(T).forEach(([k, t]) => { if (k !== g && tRun(t)) t.segs[t.segs.length-1][1] = now; });   // solo un grupo en marcha
  const t = T[g] = T[g] || { segs:[], done:false }; if (!tRun(t)) t.segs.push([now, null]); t.done = false;
}
function tPause(date, g){ const t = tGet(date, g); if (tRun(t)) t.segs[t.segs.length-1][1] = Date.now(); }
function tFinish(date, g){ tPause(date, g); const t = tGet(date, g); if (t) t.done = true; }
function sessMs(date){ return Object.values(state.timers[date] || {}).reduce((a, t) => a + tMs(t), 0); }
const clock = ms => { const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; };
const durMin = v => { if (v > 0 && v < 1) return '<1 min'; v = Math.round(v); const h = Math.floor(v/60), m = v%60; return h ? `${h} h${m ? ` ${m} min` : ''}` : `${m} min`; };
setInterval(() => document.querySelectorAll('[data-tlive]').forEach(el => { const [d, g] = el.dataset.tlive.split('|'); el.textContent = clock(g === '*' ? sessMs(d) : tMs(tGet(d, g))); }), 1000);

function planGroupOrder(day){ const o = []; day.ex.forEach(n => { const g = groupOf(n); if (!o.includes(g)) o.push(g); }); return o; }
function hoySections(day){
  const logged = state.logs.filter(l => l.date === selDate).map(l => l.n);

}

function groupHead(s){
  const t = tGet(selDate, s.g), run = tRun(t), ms = tMs(t), isToday = selDate === todayISO();
  const all = [...s.items, ...s.extra], done = all.filter(n => logOn(n, selDate)).length;
  let tm = '';
  if (isToday) {
    tm = run ? `<span class="gtime run" data-tlive="${selDate}|${esc(s.g)}">${clock(ms)}</span>`
             : t ? `<button class="gtime edt ${t.done ? 'fin' : ''}" data-act="tedit" data-g="${esc(s.g)}" title="Cambiar o borrar el tiempo">${t.done ? '✓ ' + durMin(ms/60000) : clock(ms)} ✎</button>` : '';
    tm += `${run ? `<button class="tb" data-act="tpause" data-g="${esc(s.g)}" title="Pausa">⏸</button>` : `<button class="tb play" data-act="tstart" data-g="${esc(s.g)}" title="${t ? 'Seguir' : 'Iniciar'}">▶</button>`}
      ${t && !t.done ? `<button class="tb" data-act="tfin" data-g="${esc(s.g)}" title="Finalizar">■</button>` : ''}`;
  } else tm = ms ? `<button class="gtime edt fin" data-act="tedit" data-g="${esc(s.g)}" title="Cambiar o borrar el tiempo">⏱ ${durMin(ms/60000)} ✎</button>`
                 : `<button class="tb" data-act="tedit" data-g="${esc(s.g)}" title="Poner el tiempo">⏱ ＋</button>`;
  return `<div class="gh" style="--gc:${gc(s.g)}" ${s.plan ? 'data-gdrag="1"' : ''}>
    <span class="gname">${esc(s.g)}</span><span class="gcnt">${done}/${all.length}</span>
    <span class="gsp"></span>${tm}
    <button class="tb add" data-act="gadd" data-g="${esc(s.g)}">+ Añadir</button></div>`;
}

  h += `<div class="dayhead"><div class="dht"><div class="t">${esc(day.name)}</div>${sms || anyRun ? `<div class="sess">⏱ Sesión <b ${anyRun ? `data-tlive="${selDate}|*"` : ''}>${anyRun ? clock(sms) : durMin(sms/60000)}</b></div>` : ''}</div>
    <div class="gtags">${dayGroups(day).map(gtag).join('')}</div>
    <div class="prog"><i style="width:${tot ? done/tot*100 : 0}%"></i><i class="sk" style="width:${tot ? skipped/tot*100 : 0}%"></i></div>
    <div class="muted" style="margin-top:6px">${done} de ${tot} hechos${skipped ? ` · ${skipped} sin hacer` : ''}${tot > 1 ? ' · mantén pulsado para ordenar' : ''}</div></div>`;
  if (!tot) h += `<p class="empty">Este día no tiene ejercicios todavía.</p>`;
  h += `<div id="secs">` + secs.map(s => `<div class="gsec" data-g="${esc(s.g)}" ${s.plan ? 'data-gplan="1"' : ''}>${groupHead(s)}<div class="gitems">${s.items.map(n => exCard(n, false)).join('')}${s.extra.map(n => exCard(n, true)).join('')}</div></div>`).join('') + `</div>`;
  // actividades extra del día
  const acts = state.actLogs.filter(a => a.date === selDate);
  if (acts.length) h += `<div class="gh" style="--gc:var(--ac2)"><span class="gname">Actividades</span><span class="gsp"></span><span class="gtime fin">${durMin(acts.reduce((a,x) => a + x.min, 0))}</span></div>`
    + acts.map(a => { const A = actOf(a.a); return `<div class="actrow" data-actlog="${esc(a.id)}" style="--gc:${A.c}"><span class="aico">${A.ico}</span><span class="an">${esc(A.n)}</span><b>${durMin(a.min)}</b><span class="chev">›</span></div>`; }).join('');
  h += `<button class="btn xbtn" id="xtraBtn">＋ Extra de hoy</button><div class="muted" style="text-align:center;margin-top:4px">Actividad (kayak, correr…) o ejercicio de otro grupo, solo para hoy</div>`;
  h += `<button class="btn ghost" id="otherBtn">+ Añadir otro grupo al plan</button>`;
  $('#v-hoy').innerHTML = h;
}

function saveCard(card, n){
  const val = f => { const el = card.querySelector(`[data-f="${f}"]`); return el.value.trim() !== '' ? el.value.trim() : el.placeholder.trim(); };
  if (TIMED.has(n)) {
    const tm = card.querySelector('[data-f=tm]'), ts = card.querySelector('[data-f=ts]');
    let sec = (parseInt(tm.value) || 0) * 60 + (parseInt(ts.value) || 0);
    if (!sec && !tm.value.trim() && !ts.value.trim()) sec = (parseInt(tm.placeholder) || 0) * 60 + (parseInt(ts.placeholder) || 0);
    if (!sec) { toast('Pon el tiempo'); return; }
    const e0 = logOn(n, selDate);
    const rec = { id: e0 ? e0.id : uid(), date:selDate, plan:state.activePlan, day:selDay, n, g:groupOf(n), min:null, max:null, dur:sec, sets:'', reps:'', ts:Date.now() };
    if (card.dataset.x) rec.extra = true;
    if (e0) Object.assign(e0, rec); else state.logs.push(rec);
    unskip(n, selDate); save(); toast(`Guardado · ${fmtSec(sec)} ✓`); openName = null; render();
    const el = [...document.querySelectorAll('#v-hoy .ex')].find(x => x.dataset.n === n);
    if (el) { el.scrollIntoView({ block:'nearest' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1300); }
    return;
  }
  let mn = num(val('min')), mx = num(val('max'));
  if (Number.isNaN(mn) || Number.isNaN(mx)) { toast('Peso no válido'); return; }
  if (mn == null) mn = mx; if (mx == null) mx = mn;
  if (mn != null && mn > mx) [mn, mx] = [mx, mn];
  const ex0 = logOn(n, selDate);
  const rec = { id: ex0 ? ex0.id : uid(), date:selDate, plan:state.activePlan, day:selDay, n, g:groupOf(n), min:mn, max:mx, dur:null, sets:val('sets'), reps:val('reps'), ts:Date.now() };
  if (card.dataset.x) rec.extra = true;
  if (ex0) Object.assign(ex0, rec); else state.logs.push(rec);
  unskip(n, selDate); save();
  const prev = lastBefore(n, selDate);
  toast(prev && mx != null && prev.max != null && mx > prev.max ? `Guardado · +${fmtN(mx - prev.max)} kg respecto a la última vez 💪` : 'Guardado ✓');
  openName = null;   // se cierra; no se abre el siguiente
  render();
  const el = [...document.querySelectorAll('#v-hoy .ex')].find(x => x.dataset.n === n);
  if (el) { el.scrollIntoView({ block:'nearest' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1300); }
}

let suppressClick = false;
$('#v-hoy').addEventListener('click', async e => {
  if (suppressClick) { suppressClick = false; return; }
  if (e.target.closest('#visit')) {
    const inf = dayIndex()[selDate];
    if (inf && (inf.logs.length || inf.acts.length)) { toast('Ya cuenta como día de gym'); return; }
    if (state.visits[selDate]) delete state.visits[selDate]; else state.visits[selDate] = true;
    save(); render(); return;
  }
  const chip = e.target.closest('[data-day]');
  if (chip) { selDay = chip.dataset.day; openName = null; renderHoy(); return; }
  if (e.target.closest('#xtraBtn')) { openPicker({ mode:'act' }); return; }
  if (e.target.closest('#otherBtn')) { const used = planGroupOrder(curDay()); openPicker({ mode:'add', group: GROUPS.find(g => !used.includes(g)) || GROUPS[0] }); return; }
  const ar = e.target.closest('[data-actlog]'); if (ar) { const a = state.actLogs.find(x => x.id === ar.dataset.actlog); if (a) openActForm(a.a, a); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, g = b.dataset.g;
  if (a === 'tstart') { tStart(selDate, g); state.runDay = { date:selDate, plan:state.activePlan, day:selDay }; save(); renderHoy(); return; }
  if (a === 'tpause') { tPause(selDate, g); save(); renderHoy(); return; }
  if (a === 'tedit') { openTimeForm(g); return; }
  if (a === 'treset') { if (await ask(`¿Borrar el tiempo de ${g} de este día?`, 'Borrar', true)) { delete state.timers[selDate][g]; if (!Object.keys(state.timers[selDate]).length) delete state.timers[selDate]; save(); renderHoy(); } return; }
  if (a === 'tfin') { tFinish(selDate, g); save(); renderHoy(); toast(`${g}: ${durMin(tMs(tGet(selDate, g))/60000)}`); return; }
  if (a === 'gadd') { const inPlan = planGroupOrder(curDay()).includes(g); openPicker({ mode: inPlan ? 'add' : 'addx', group:g }); return; }
  const card = b.closest('.ex'); if (!card) return;
  const n = card.dataset.n, isX = !!card.dataset.x;
  if (a === 'toggle') { openName = openName === n ? null : n; renderHoy(); }
  else if (a === 'skip') {
    if (isSkip(n, selDate)) unskip(n, selDate);
    else { (state.skips[selDate] = state.skips[selDate] || []).push(n); if (openName === n) openName = null; toast('Marcado como no hecho hoy'); }
    save(); renderHoy();
  }
  else if (a === 'save') saveCard(card, n);
  else if (a === 'evo') openExEvo(n);
  else if (a === 'swap') openPicker({ mode:'swap', n, x:isX, group:groupOf(n) });
  else if (a === 'del') { if (await ask(`¿Quitar «${n}» de este día del plan?\nEl historial se conserva.`, 'Quitar', true)) { openName = null; changeDay(d => d.ex.splice(d.ex.indexOf(n), 1)); } }
  else if (a === 'delx') { state.dayExtra[selDate] = extrasOn(selDate).filter(x => x !== n); if (!state.dayExtra[selDate].length) delete state.dayExtra[selDate]; openName = null; save(); render(); }
  else if (a === 'unlog') { if (await ask(`¿Borrar lo apuntado hoy en «${n}»?`, 'Borrar', true)) { state.logs = state.logs.filter(l => !(l.n === n && l.date === selDate)); save(); render(); } }
});
$('#v-hoy').addEventListener('change', e => { if (e.target.id === 'fDate') { selDate = e.target.value || todayISO(); openName = null; render(); } });
$('#v-hoy').addEventListener('contextmenu', e => { if (e.target.closest('.exh, .gh')) e.preventDefault(); });

/* ---------- ordenar: mantener pulsado y arrastrar (ejercicios dentro de su grupo, o grupos enteros) ---------- */
let lp = null, drag = null;
$('#v-hoy').addEventListener('pointerdown', e => {
  suppressClick = false;
  if (e.button > 0 || e.target.closest('button, input, .exb')) return;
  const card = e.target.closest('.ex[data-drag]'), gh = e.target.closest('.gh[data-gdrag]');
  if (!card && !gh) return;
  const el = gh ? gh.closest('.gsec') : card;
  lp = { x:e.clientX, y:e.clientY, id:e.pointerId, t:setTimeout(() => startDrag(el, gh ? 'g' : 'e'), 450) };
});
function startDrag(el, kind){
  if (!lp) return;
  const rows = kind === 'e' ? [...el.parentNode.querySelectorAll(':scope > .ex[data-drag]')] : [...document.querySelectorAll('#secs > .gsec[data-gplan]')];
  if (rows.length < 2) { lp = null; return; }
  const rects = rows.map(x => { const b = x.getBoundingClientRect(); return { top:b.top + scrollY, h:b.height }; });
  drag = { kind, rows, rects, from:rows.indexOf(el), to:rows.indexOf(el), y0:lp.y + scrollY, g: kind === 'e' ? el.closest('.gsec').dataset.g : null };
  el.classList.add('dragging'); document.body.classList.add('noselect');
  if (navigator.vibrate) navigator.vibrate(20);
}
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive:false });
document.addEventListener('pointermove', e => {
  if (lp && !drag) { if (Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) { clearTimeout(lp.t); lp = null; } return; }
  if (!drag) return;
  const R = drag.rects, f = drag.from, dy = e.clientY + scrollY - drag.y0;
  drag.rows[f].style.transform = `translateY(${dy}px)`;
  const c = R[f].top + R[f].h / 2 + dy;
  let to = 0; R.forEach((x, k) => { if (k !== f && c > x.top + x.h / 2) to++; });
  drag.to = to; const sh = R[f].h + (drag.kind === 'g' ? 12 : 8);
  drag.rows.forEach((x, k) => { if (k === f) return; let m = 0;
    if (f < to && k > f && k <= to) m = -sh; if (f > to && k >= to && k < f) m = sh;
    x.style.transform = m ? `translateY(${m}px)` : ''; });
  if (e.clientY < 90) scrollBy(0, -12); else if (e.clientY > innerHeight - 120) scrollBy(0, 12);
});
function endPress(){
  if (lp) { clearTimeout(lp.t); lp = null; }
  if (!drag) return;
  const { kind, from, to, g } = drag; drag = null; document.body.classList.remove('noselect'); suppressClick = true; setTimeout(() => suppressClick = false, 350);
  if (from === to) { renderHoy(); return; }
  changeDay(d => {
    const order = planGroupOrder(d), lists = {}; order.forEach(x => lists[x] = d.ex.filter(n => groupOf(n) === x));
    if (kind === 'e') { const L = lists[g]; const [x] = L.splice(from, 1); L.splice(to, 0, x); }
    else { const [x] = order.splice(from, 1); order.splice(to, 0, x); }
    d.ex = order.flatMap(x => lists[x]);
  });
}
document.addEventListener('pointerup', endPress);
document.addEventListener('pointercancel', endPress);

/* ---------- selectores (cambiar, añadir, extra de hoy) ---------- */
let ovMode = null;
function openOv(mode, html){ ovMode = mode; $('#ovBody').innerHTML = html; $('#ov').hidden = false; $('#ovBody').scrollTop = 0; }
function closeOv(){ $('#ov').hidden = true; ovMode = null; }
const ovHead = (title, btn = '✕ Cancelar') => `<div class="ovh"><h2>${title}</h2><button class="tb cancel" id="ovClose">${btn}</button></div>`;
function openPicker(o){ Object.assign(pick, { n:null, x:false, group:null }, o); if (!pick.group) pick.group = (dayGroups(curDay())[0] || GROUPS[0]); renderPicker(); }
function renderPicker(){
  const day = curDay();
  if (pick.mode === 'act') {
    openOv('pick', ovHead('Extra de hoy') + xtabs('act') + `<div class="actgrid">${state.acts.map(A => {
      const m = state.actLogs.filter(a => a.date === selDate && a.a === A.id).reduce((s,a) => s + a.min, 0);
      return `<button class="actb" data-acta="${esc(A.id)}" style="--gc:${A.c}"><span class="aico">${A.ico}</span><span>${esc(A.n)}</span>${m ? `<small>${durMin(m)}</small>` : ''}</button>`; }).join('')}</div>
      <p class="muted">Solo se guarda el tiempo. Puedes añadir más actividades en Ajustes.</p>`);
    return;
  }
  const cat = catalog(), used = new Set([...day.ex, ...extrasOn(selDate)]);
  const list = (cat[pick.group] || []).filter(n => !used.has(n));
  const title = pick.mode === 'swap' ? `Cambiar «${esc(pick.n)}» por…` : pick.mode === 'addx' ? 'Extra de hoy' : `Añadir a «${esc(day.name)}»`;
  openOv('pick', ovHead(title) + (pick.mode === 'addx' ? xtabs('addx') : '')
    + `<div class="chips">${Object.keys(cat).map(g => `<button class="chip ${g===pick.group?'on':''}" data-g="${esc(g)}">${esc(g)}<div class="dots"><i style="background:${gc(g)}"></i></div></button>`).join('')}</div>
    <div style="--gc:${gc(pick.group)}">${groupList(pick.group, list, n => `<button class="li" data-pn="${esc(n)}">${pic(n,'thumb')}<div class="x">${esc(n)}${hasLogs(n)?`<div class="muted">con historial${staleBadge(n)}</div>`:''}</div></button>`) || '<p class="muted">No quedan ejercicios de este grupo.</p>'}</div>
    <div class="row"><input id="newEx" placeholder="Otro ejercicio de ${esc(pick.group)}…"><button class="btn sm" id="newExBtn">Añadir</button></div>
    ${pick.mode === 'addx' ? '<p class="muted">Se añade solo para hoy; el plan no cambia.</p>' : pick.mode === 'add' ? '<p class="muted">Se añade al plan y saldrá también los próximos días.</p>' : ''}`);
}
const xtabs = t => `<div class="seg"><button data-xt="act" class="${t==='act'?'on':''}">🏃 Actividad</button><button data-xt="addx" class="${t==='addx'?'on':''}">🏋️ Ejercicio</button></div>`;
function addCustom(n, g){ if (!GRP[n] && !state.custom.some(c => c.n === n)) state.custom.push({ n, g }); }
function applyPick(n){
  const { mode, n:old, x } = pick; closeOv(); openName = n;
  if (mode === 'swap' && x) { state.dayExtra[selDate] = extrasOn(selDate).map(e => e === old ? n : e); save(); render(); }
  else if (mode === 'swap') changeDay(d => { const k = d.ex.indexOf(old); if (k >= 0) d.ex[k] = n; });
  else if (mode === 'addx') { state.dayExtra[selDate] = [...extrasOn(selDate), n]; save(); render(); toast('Añadido solo para hoy'); }
  else changeDay(d => {   // lo coloca al final de su grupo
    const g = groupOf(n); let k = -1; d.ex.forEach((e, i) => { if (groupOf(e) === g) k = i; });
    d.ex.splice(k >= 0 ? k + 1 : d.ex.length, 0, n); });
}
/* cambiar o borrar a mano el tiempo de un grupo (cualquier día) */
function openTimeForm(g){
  const t = tGet(selDate, g), m = Math.round(tMs(t) / 60000); pick.tg = g;
  openOv('tform', ovHead(`⏱ Tiempo de ${esc(g)}`) + `<p class="muted">${esc(longDate(selDate))}</p>
    <div class="hm"><label>Horas<input id="th" inputmode="numeric" pattern="[0-9]*" value="${t ? Math.floor(m/60) || '' : ''}" placeholder="0"></label>
    <label>Minutos<input id="tmn" inputmode="numeric" pattern="[0-9]*" value="${t ? m % 60 || '' : ''}" placeholder="0"></label></div>
    <button class="btn" id="tSave">Guardar tiempo</button>
    ${t ? '<button class="btn danger" id="tDel">Borrar el tiempo de este grupo</button>' : ''}`);
  setTimeout(() => { const i = $('#tmn'); if (i) i.focus(); }, 60);
}
function openActForm(aid, entry){
  pick.act = aid; pick.edit = entry ? entry.id : null; const A = actOf(aid), m = entry ? entry.min : 0;
  openOv('actf', ovHead(`${A.ico} ${esc(A.n)}`) + `<p class="muted">${esc(longDate(selDate))} · ¿cuánto tiempo?</p>
    <div class="hm"><label>Horas<input id="ah" inputmode="numeric" pattern="[0-9]*" value="${entry ? Math.floor(m/60) || '' : ''}" placeholder="0"></label>
    <label>Minutos<input id="am" inputmode="numeric" pattern="[0-9]*" value="${entry ? m % 60 || '' : ''}" placeholder="0"></label></div>
    <button class="btn" id="actSave">${entry ? 'Actualizar' : 'Guardar'}</button>
    ${entry ? '<button class="btn danger" id="actDel">Borrar esta actividad</button>' : ''}`);
  setTimeout(() => { const i = $(entry ? '#am' : '#ah'); if (i) i.focus(); }, 60);
}
$('#ov').addEventListener('click', async e => {
  if (e.target.id === 'ov' || e.target.closest('#ovClose')) { closeOv(); return; }
  if (ovMode === 'pick') {
    const xt = e.target.closest('[data-xt]'); if (xt) { pick.mode = xt.dataset.xt; renderPicker(); return; }
    const aa = e.target.closest('[data-acta]'); if (aa) { openActForm(aa.dataset.acta); return; }
    const g = e.target.closest('[data-g]'); if (g) { pick.group = g.dataset.g; renderPicker(); return; }
    const n = e.target.closest('[data-pn]'); if (n) { applyPick(n.dataset.pn); return; }
    if (e.target.id === 'newExBtn') { const name = $('#newEx').value.trim(); if (!name) return; addCustom(name, pick.group); applyPick(name); }
  } else if (ovMode === 'actf') {
    if (e.target.id === 'actSave') {
      const h = parseInt($('#ah').value) || 0, m = parseInt($('#am').value) || 0, tot = h * 60 + m;
      if (!tot) { toast('Pon el tiempo'); return; }
      const ex = state.actLogs.find(a => a.id === pick.edit);
      if (ex) ex.min = tot; else state.actLogs.push({ id:uid(), date:selDate, a:pick.act, min:tot, ts:Date.now() });
      save(); closeOv(); render(); toast(`${actOf(pick.act).n} · ${durMin(tot)}`);
    } else if (e.target.id === 'actDel') {
      if (await ask('¿Borrar esta actividad?', 'Borrar', true)) { state.actLogs = state.actLogs.filter(a => a.id !== pick.edit); save(); closeOv(); render(); }
    }
  } else if (ovMode === 'tform') {
    const g = pick.tg;
    if (e.target.id === 'tSave') {
      const tot = (parseInt($('#th').value) || 0) * 60 + (parseInt($('#tmn').value) || 0);
      if (!tot) { toast('Pon el tiempo, o usa «Borrar»'); return; }
      const T = state.timers[selDate] = state.timers[selDate] || {};
      T[g] = { segs:[[0, tot * 60000]], done:true }; save(); closeOv(); render(); toast(`${g}: ${durMin(tot)}`);
    } else if (e.target.id === 'tDel') {
      if (await ask(`¿Borrar el tiempo de ${g} de este día?`, 'Borrar', true)) {
        delete state.timers[selDate][g]; if (!Object.keys(state.timers[selDate]).length) delete state.timers[selDate];
        save(); closeOv(); render(); toast('Tiempo borrado'); }
    }
  } else if (ovMode === 'info') {
    const ge = e.target.closest('[data-goevo]');
    if (ge) { const n = ge.dataset.goevo; closeOv(); evoTab = 'pesos'; pesOpen.add(groupOf(n)); show('evo'); openPesoDetail(n); }
  } else if (ovMode === 'pdet') {
    const b = e.target.closest('[data-delog]');
    if (b) { const l = state.logs.find(x => x.id === b.dataset.delog);
      if (l && await ask(`¿Borrar el registro del ${fmt(l.date)} (${rng(l)})?`, 'Borrar', true)) { state.logs = state.logs.filter(x => x !== l); save(); render(); if (state.logs.some(x => x.n === l.n)) openExEvo(l.n); else closeOv(); } }
  } else if (ovMode === 'wipe') {
    if (e.target.id === 'wipeExp') exportData();
    else if (e.target.id === 'wipeNext') openWipe(2);
    else if (e.target.id === 'wipeGo' && !e.target.disabled) { state.logs = []; state.visits = {}; state.skips = {}; state.actLogs = []; state.timers = {}; state.dayExtra = {}; save(); closeOv(); render(); toast('Registros borrados'); }
  }
});
$('#ov').addEventListener('input', e => { if (e.target.id === 'wipeTxt') $('#wipeGo').disabled = e.target.value.trim().toUpperCase() !== 'BORRAR'; });
$('#ov').addEventListener('keydown', e => { if (e.key === 'Enter' && ovMode === 'actf') $('#actSave').click(); if (e.key === 'Enter' && ovMode === 'tform') $('#tSave').click(); });

function chart(L, leg = ['Peso máx.', 'Peso mín.']){
  const W=340, H=190, pl=34, pr=12, pt=12, pb=26;
  const t = L.map(l => parseISO(l.date).getTime()), t0 = t[0], t1 = t[t.length-1];
  let y0 = Math.min(...L.map(l => l.min)), y1 = Math.max(...L.map(l => l.max));
  const span = (y1 - y0) || 10; y0 = Math.max(0, y0 - span*0.15); y1 = y1 + span*0.15;
  const X = v => t1 === t0 ? pl + (W-pl-pr)/2 : pl + (v - t0)/(t1 - t0)*(W-pl-pr);
  const Y = v => pt + (1 - (v - y0)/(y1 - y0))*(H-pt-pb);
  const dec = (y1 - y0) < 8 ? 1 : 0;
  let g = '';
  for (let k = 0; k <= 4; k++){ const v = y0 + (y1-y0)*k/4, y = Y(v);
    g += `<line x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="grid"/><text x="${pl-5}" y="${(y+3).toFixed(1)}" class="ax" text-anchor="end">${v.toFixed(dec).replace('.',',')}</text>`; }
  const path = f => L.map((l,i) => `${i?'L':'M'}${X(t[i]).toFixed(1)},${Y(l[f]).toFixed(1)}`).join('');
  const dots = (f,c) => L.map((l,i) => `<circle cx="${X(t[i]).toFixed(1)}" cy="${Y(l[f]).toFixed(1)}" r="3" class="${c}"/>`).join('');
  g += `<path d="${path('min')}" class="lmin"/><path d="${path('max')}" class="lmax"/>${dots('min','dmin')}${dots('max','dmax')}`;
  g += `<text x="${pl}" y="${H-8}" class="ax">${fmt(L[0].date)}</text><text x="${W-pr}" y="${H-8}" class="ax" text-anchor="end">${fmt(L[L.length-1].date)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}</svg><div class="legend"><span><i class="k kmax"></i>${leg[0]}</span>${leg[1] ? `<span><i class="k kmin"></i>${leg[1]}</span>` : ''}</div>`;
}
function spark(L){
  if (L.length < 2) return '<svg class="spark" viewBox="0 0 70 26"></svg>';
  const v = L.map(l => l.max), a = Math.min(...v), b = Math.max(...v), r = (b - a) || 1;
  const pts = v.map((x, i) => `${(i/(v.length-1)*66+2).toFixed(1)},${(23 - (x - a)/r*20).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 70 26"><polyline points="${pts}"/></svg>`;
}
const delta = d => d > 0 ? `<span class="up">+${fmtN(d)} kg</span>` : d < 0 ? `<span class="down">${fmtN(d)} kg</span>` : '0 kg';
function trend(L){
  const last = L[L.length-1], base = [...L].reverse().find(l => l.date <= addDays(todayISO(), -30)) || L[0], d = last.max - base.max;
  return d > 0 ? `<span class="trd up">▲ +${fmtN(d)}</span>` : d < 0 ? `<span class="trd down">▼ ${fmtN(d)}</span>` : `<span class="trd">=</span>`;
}

      <button class="pbtn" data-plan="${esc(p.id)}">
        <div class="pn"><span class="radio"></span>${esc(p.name)}${p.id==='mi'||p.custom?'<span class="pill">PERSONALIZADO</span>':''}</div>
        <div class="pd">${esc(p.desc||'')}</div><div class="pdays">${p.days.map(d => `<span>${esc(d.name)}</span>`).join('')}</div></button>
      <div class="prow"><button class="pexp" data-exp="${esc(p.id)}">${expPlan===p.id ? 'Ocultar ejercicios ▴' : (p.id==='mi'||p.custom ? 'Ver ejercicios ▾' : 'Ver ejercicios recomendados ▾')}</button><span class="pacts"><button class="pexp" data-dup="${esc(p.id)}">⧉ Duplicar</button>${p.custom ? `<button class="pexp pdel" data-delplan="${esc(p.id)}">Eliminar</button>` : ''}</span></div>
      ${expPlan===p.id ? p.days.map(d => `<div class="pday"><div class="pdn">${esc(d.name)} ${dayGroups(d).map(gtag).join('')}</div>
          ${d.ex.map((n, k) => `<div class="pex"><span class="pexi" data-info="${esc(n)}">${pic(n,'thumb')}<span>${esc(n)}</span></span>
            <button class="ib sm" data-pmv="${esc(p.id)}|${esc(d.id)}|${k}|-1" ${k===0?'disabled':''}>↑</button><button class="ib sm" data-pmv="${esc(p.id)}|${esc(d.id)}|${k}|1" ${k===d.ex.length-1?'disabled':''}>↓</button></div>`).join('')}</div>`).join('')
        + (p.id !== ap.id ? `<div style="padding:0 12px 12px"><button class="btn" data-plan="${esc(p.id)}">Usar este plan</button></div>` : '') : ''}
    </div>`).join('');
  h += `<h2 style="margin-top:28px">Actividades extra</h2><p class="muted">Disponibles con cualquier plan desde «＋ Extra de hoy». Solo se guarda el tiempo.</p>`
    + state.acts.map(A => `<div class="actrow" style="--gc:${A.c}"><span class="aico">${A.ico}</span><span class="an">${esc(A.n)}</span><button class="ib" data-rmact="${esc(A.id)}">✕</button></div>`).join('')
    + `<div class="row"><input id="newActIco" placeholder="🚴" style="width:64px;flex:none;text-align:center"><input id="newActN" placeholder="Nueva actividad (p. ej. Bici)"><button class="btn sm" id="newActBtn">Añadir</button></div>`;
  h += `<h2 style="margin-top:28px">Copia de seguridad</h2>
    <p class="muted">${pl(state.logs.length,'registro','registros')} y ${pl(Object.keys(dayIndex()).length,'día','días')} de gym guardados en este móvil. Los datos se guardan solo en este navegador: exporta una copia de vez en cuando (por ejemplo, a Drive).</p>
    <button class="btn" id="exp">Exportar copia</button>
    <label class="btn sec" style="text-align:center">Importar copia<input type="file" id="imp" accept="application/json,.json" hidden></label>
    <button class="btn danger" id="wipe">Borrar todos los registros</button>`;
  $('#v-aj').innerHTML = h;
}
async function exportData(){
  const name = `entreno-${todayISO()}.json`;
  const file = new File([JSON.stringify(state)], name, { type:'application/json' });
  if (navigator.canShare && navigator.canShare({ files:[file] })) {
    try { await navigator.share({ files:[file], title:'Copia Mis entrenos' }); return; } catch(e){ if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
$('#v-aj').addEventListener('click', async e => {
  const t = e.target, ap = activePlan();
  const th = t.closest('[data-thm]'); if (th) { state.theme = th.dataset.thm; save(); applyTheme(); renderAj(); return; }
  const ex = t.closest('[data-exp]'); if (ex) { expPlan = expPlan === ex.dataset.exp ? null : ex.dataset.exp; renderAj(); return; }
  const du = t.closest('[data-dup]');
  if (du) { const src = state.plans.find(x => x.id === du.dataset.dup);
    const name = await askText(`Nombre del nuevo plan personalizado (copia de «${src.name}»):`, `${src.name} (mío)`, 'Crear');
    if (!name) return;
    if (state.plans.some(x => x.name.toLowerCase() === name.toLowerCase())) { toast('Ya hay un plan con ese nombre'); return; }
    const c = clone(src); Object.assign(c, { id:'c' + uid(), base:src.base || src.id, custom:true, name, desc:`Personalizado · copia de «${src.name}»` });
    state.plans.splice(state.plans.indexOf(src) + 1, 0, c); state.activePlan = c.id; selDay = suggestedDay(c); expPlan = null;
    save(); render(); toast(`Creado «${name}» y puesto como plan activo`); return; }
  const dp = t.closest('[data-delplan]');
  if (dp) { const pp = state.plans.find(x => x.id === dp.dataset.delplan);
    if (await ask(`¿Eliminar el plan «${pp.name}»?\nEl historial se conserva.`, 'Eliminar', true)) {
      state.plans = state.plans.filter(x => x !== pp);
      if (state.activePlan === pp.id) { state.activePlan = state.plans.some(x => x.id === pp.base) ? pp.base : 'mi'; selDay = suggestedDay(activePlan()); }
      save(); render(); } return; }
  const pm = t.closest('[data-pmv]');
  if (pm) { const [pid, did, k, dd] = pm.dataset.pmv.split('|'); const d = state.plans.find(x => x.id === pid).days.find(x => x.id === did);
    const i = +k, j = i + +dd; if (j >= 0 && j < d.ex.length) { [d.ex[i], d.ex[j]] = [d.ex[j], d.ex[i]]; save(); renderAj(); } return; }
  const inf = t.closest('[data-info]'); if (inf) { openInfo(inf.dataset.info); return; }
  const plb = t.closest('[data-plan]');
  if (plb) { state.activePlan = plb.dataset.plan; selDay = suggestedDay(activePlan()); openName = null; save(); render(); toast('Plan: ' + activePlan().name); return; }
  const ra = t.closest('[data-rmact]');
  if (ra) { const A = actOf(ra.dataset.rmact); if (await ask(`¿Quitar «${A.n}» de las actividades?\nLo ya apuntado se conserva.`, 'Quitar', true)) { state.acts = state.acts.filter(x => x.id !== A.id); save(); renderAj(); } return; }
  const up = t.closest('[data-up]'), rm = t.closest('[data-rm]');
  if (up) { const i = +up.dataset.up; if (i > 0) { [ap.days[i-1], ap.days[i]] = [ap.days[i], ap.days[i-1]]; save(); render(); } return; }
  if (rm) { const i = +rm.dataset.rm; if (await ask(`¿Eliminar el día «${ap.days[i].name}»?\nEl historial se conserva.`, 'Eliminar', true)) { ap.days.splice(i,1); save(); render(); } return; }
  if (t.id === 'addDay') { ap.days.push({ id:'D'+uid(), name:'Nuevo día', ex:[] }); save(); render(); }
  else if (t.id === 'newActBtn') {
    const n = $('#newActN').value.trim(); if (!n) return;
    const pal = ['#20c997','#f06595','#fab005','#7950f2','#ff6b6b','#228be6'];
    state.acts.push({ id:'a' + uid(), n, ico:$('#newActIco').value.trim() || '⭐', c:pal[state.acts.length % pal.length] }); save(); renderAj(); toast('Actividad añadida'); }
  else if (t.id === 'resetPlan') { if (await ask(`¿Restaurar «${ap.name}» a como venía?\nEl historial se conserva.`, 'Restaurar')) { const fresh = planFromTpl(TPL.find(x => x.id === ap.id)); ap.days = fresh.days; ap.name = fresh.name; ap.desc = fresh.desc; save(); render(); } }
  else if (t.id === 'exp') exportData();
  else if (t.id === 'wipe') openWipe(1);
});
$('#v-aj').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'planName') { const v = t.value.trim(); if (v) { activePlan().name = v; save(); render(); toast('Nombre guardado'); } return; }
  if (t.dataset.rn != null) { activePlan().days[+t.dataset.rn].name = t.value.trim() || 'Día'; save(); render(); return; }
  if (t.id === 'imp' && t.files[0]) {
    const r = new FileReader();
    r.onload = async () => {
      let s;
      try { s = JSON.parse(r.result); if (!valid(s)) { if (s && Array.isArray(s.logs) && Array.isArray(s.routine)) s = migrateV1(s); else throw 0; } }
      catch(err){ toast('El fichero no es una copia válida'); return; }
      if (await ask(`La copia tiene ${pl(s.logs.length,'registro','registros')}.\n¿Sustituir los datos actuales?`, 'Sustituir', true)) { state = normalize(s); save(); applyTheme(); selDay = suggestedDay(activePlan()); render(); toast('Copia importada'); }
    };
    r.readAsText(t.files[0]);
  }
});

/* ---------- navegación ---------- */
function render(){
  const ap = activePlan(), s = ap.days.find(d => d.id === suggestedDay(ap));
  $('#hdrSub').textContent = s ? `${ap.name} · toca ${s.name}` : ap.name;
  ({ hoy:renderHoy, evo:renderEvo, cat:renderCat, aj:renderAj })[view]();
}
function show(v){
  view = v;
  ['hoy','evo','cat','aj'].forEach(k => { $('#v-'+k).hidden = k !== v; });
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  render(); window.scrollTo(0,0);
}
document.querySelector('nav').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) show(b.dataset.v); });

show('hoy');

/* ---------- portada ---------- */
function sessionInProgress(){
  const today = todayISO(), T = state.timers[today] || {};
  if (Object.values(T).some(t => !t.done)) return true;                       // algún grupo con el cronómetro sin finalizar
  if (!state.logs.some(l => l.date === today)) return false;
  const ap = activePlan(), tl = state.logs.filter(l => l.date === today && l.plan === ap.id).sort((a,b) => b.ts - a.ts)[0];
  const d = tl && ap.days.find(x => x.id === tl.day); if (!d) return false;
  return d.ex.some(n => !logOn(n, today) && !isSkip(n, today));              // quedan ejercicios por hacer
}
function runningDay(){
  const today = todayISO(), ap = activePlan();
  if (state.runDay && state.runDay.date === today && state.runDay.plan === ap.id) return state.runDay.day;
  const tl = state.logs.filter(l => l.date === today && l.plan === ap.id).sort((a,b) => b.ts - a.ts)[0];
  return tl ? tl.day : selDay;
}
function renderCover(){
  const h = new Date().getHours();
  $('#cvHello').textContent = (h < 6 ? 'Buenas noches' : h < 13 ? 'Buenos días' : h < 21 ? 'Buenas tardes' : 'Buenas noches') + ' 💪';
  const ap = activePlan(), d = ap.days.find(x => x.id === suggestedDay(ap));
  const idx = dayIndex(), today = todayISO(), inf = idx[today];
  const pre = today.slice(0,8), month = Object.keys(idx).filter(x => x.startsWith(pre)).length;
  const stats = `<div class="cvst"><div><b>${month}</b><span>días este mes</span></div><div><b>${streak(idx)}</b><span>días seguidos</span></div><div><b>${state.logs.length}</b><span>registros</span></div></div>`;
  if (sessionInProgress()) {
    selDay = runningDay(); cvPicked = true;
    const day = ap.days.find(x => x.id === selDay), sms = sessMs(today), run = Object.values(state.timers[today] || {}).some(tRun);
    const all = day ? day.ex : [], done = all.filter(n => logOn(n, today)).length;
    $('#cvInfo').innerHTML = `<div class="cvrun"><div class="k1">Sesión a medias · ${esc(ap.name)}</div><div class="t">${day ? esc(day.name) : ''}</div>
        ${day ? `<div class="gtags">${dayGroups(day).map(gtag).join('')}</div>` : ''}
        <div class="prog"><i style="width:${all.length ? done/all.length*100 : 0}%"></i></div>
        <div class="muted" style="margin-top:6px">${done} de ${all.length} hechos${sms || run ? ` · ⏱ <b ${run ? `data-tlive="${today}|*"` : ''}>${run ? clock(sms) : durMin(sms/60000)}</b>` : ''}</div></div>` + stats;
    $('#cvBtns').innerHTML = `<button class="btn" id="cvGo" data-go="hoy">▶ Seguir</button>`;
  } else {
    if (!cvPicked) { const tl = state.logs.filter(l => l.date === today && l.plan === ap.id).sort((a,b) => b.ts - a.ts)[0]; selDay = tl ? tl.day : (d ? d.id : selDay); cvPicked = true; }
    const sd = ap.days.find(x => x.id === selDay);
    $('#cvInfo').innerHTML = (inf ? `<div class="cvdone">✓ Hoy ya has ido${inf.logs.length ? ` · ${pl(inf.logs.length,'ejercicio','ejercicios')}` : ''}${inf.acts.length ? ` · ${inf.acts.map(a => actOf(a.a).ico).join('')}` : ''}</div>` : '')
      + (ap.days.length ? `<div class="k1">¿Qué toca hoy? · ${esc(ap.name)}</div>
          <div class="cvdays">${ap.days.map(x => `<button class="cvday ${x.id===selDay?'on':''}" data-cvday="${esc(x.id)}"><span>${esc(x.name)}${d && x.id===d.id ? '<span class="toca">TOCA</span>' : ''}</span><div class="dots">${dayGroups(x).map(g => `<i style="background:${gc(g)}"></i>`).join('')}</div></button>`).join('')}</div>
`
        : `<div class="t">Elige un plan en Ajustes</div>`) + stats;
    $('#cvBtns').innerHTML = `<div class="cvnav">
      <button class="main" data-go="hoy"><span>🏋️</span>Hoy</button><button data-go="evo"><span>📈</span>Evolución</button>
      <button data-go="cat"><span>📚</span>Ejercicios</button><button data-go="aj"><span>⚙️</span>Ajustes</button></div>`;
  }
  $('#cvVer').innerHTML = `versión ${APP_VERSION}`;
}
renderCover();
$('#cvInfo').addEventListener('click', e => { const b = e.target.closest('[data-cvday]'); if (b) { selDay = b.dataset.cvday; renderCover(); } });
$('#cvBtns').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  selDate = todayISO(); openName = null; $('#cover').classList.add('hide'); show(b.dataset.go); window.scrollTo(0,0);
});

/* ---------- funcionamiento sin conexión y aviso de versión nueva ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(() => {});
  fetch('sw.js', { cache:'no-store' }).then(r => r.text()).then(t => {
    const m = t.match(/VERSION\s*=\s*'(v\d+)'/);
    if (m && m[1] !== APP_VERSION && parseInt(m[1].slice(1)) > parseInt(APP_VERSION.slice(1)))
      $('#cvVer').innerHTML = `versión ${APP_VERSION} · hay una nueva, la <b>${m[1]}</b>: cierra y vuelve a abrir la app`;
  }).catch(() => {});
}
</script>
</body>
</html>
